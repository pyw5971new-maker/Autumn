<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가을 학습 스프린트</title>
<style>
  :root{
    color-scheme: light dark;
    --paper:#ffffff;
    --surface:#ffffff;
    --surface-2:#f5f5f5;
    --ink:#1a1a1a;
    --muted:#7a7a7a;
    --line:#e6e6e6;
    --accent-study:#33517d;
    --accent-study-bg:#e7ecf5;
    --accent-class:#3d7566;
    --accent-class-bg:#e5efe9;
    --accent-move:#a8762c;
    --accent-move-bg:#f3e9d6;
    --accent-meal:#8a7f5e;
    --accent-meal-bg:#efeada;
    --accent-event:#79497a;
    --accent-event-bg:#f0e6ee;
    --accent-personal:#5b6570;
    --accent-personal-bg:#e7eaec;
    --shadow: 0 1px 2px rgba(35,36,32,0.06), 0 6px 16px rgba(35,36,32,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#121212;
      --surface:#1b1b1b;
      --surface-2:#242424;
      --ink:#f2f2f2;
      --muted:#9a9a9a;
      --line:#333333;
      --accent-study:#8fa8d6;
      --accent-study-bg:#26314a;
      --accent-class:#8fc4af;
      --accent-class-bg:#203630;
      --accent-move:#d9ab63;
      --accent-move-bg:#3a2f19;
      --accent-meal:#cbc094;
      --accent-meal-bg:#33301f;
      --accent-event:#c99bca;
      --accent-event-bg:#382c38;
      --accent-personal:#b7bfc7;
      --accent-personal-bg:#2a2e33;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 60px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }

  .banner{
    margin:-28px -20px 0;
    border-radius:0 0 18px 18px;
    overflow:hidden;
  }
  .banner img{
    width:100%;
    height:auto;
    display:block;
  }

  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .eyebrow{
    font-family:'Pretendard',ui-monospace,monospace;
    font-size:13px;
    letter-spacing:.02em;
    color:var(--muted);
  }

  .status{
    font-size:12px;
    font-family:'Pretendard',monospace;
    color:var(--muted);
  }
  .status.ok{color:var(--accent-class);}
  .status.err{color:#b5493f;}

  .deadline{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .deadline .mark{
    font-family:'Pretendard',sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--accent-study);
    white-space:nowrap;
  }
  .deadline .mark-label{font-size:12.5px;color:var(--muted);}

  .overview{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
  }
  .chip{
    flex:0 0 auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 12px;
    min-width:84px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .chip .d{font-family:'Pretendard',monospace;font-size:12px;color:var(--muted);}
  .chip .dow{font-weight:600;font-size:13px;margin-top:1px;}
  .chip .focus{
    margin-top:6px;
    font-size:11px;
    color:var(--accent-study);
    background:var(--accent-study-bg);
    border-radius:6px;
    padding:2px 6px;
    display:inline-block;
    line-height:1.4;
  }

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    font-size:12.5px;
    color:var(--muted);
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

  details.day{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  details.day > summary{
    list-style:none;
    cursor:pointer;
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  details.day > summary::-webkit-details-marker{display:none;}
  .s-left{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .s-date{
    font-family:'Pretendard',serif;
    font-weight:700;
    font-size:19px;
  }
  .s-dow{color:var(--muted);font-size:13px;}
  .s-focus{
    font-size:12.5px;
    color:var(--accent-study);
    background:var(--accent-study-bg);
    padding:3px 8px;
    border-radius:7px;
    white-space:nowrap;
  }
  .s-total{
    font-family:'Pretendard',monospace;
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
  }
  .s-progress{
    font-family:'Pretendard',monospace;
    font-size:12px;
    font-weight:600;
    color:var(--accent-study);
    background:var(--accent-study-bg);
    padding:2px 7px;
    border-radius:6px;
    white-space:nowrap;
  }
  .chevron{
    width:18px;height:18px;flex:0 0 auto;
    color:var(--muted);
    transition:transform .18s ease;
  }
  details.day[open] .chevron{transform:rotate(90deg);}

  .timeline{
    border-top:1px solid var(--line);
    padding:6px 18px 16px;
    display:flex;
    flex-direction:column;
  }
  .tl-item{display:flex;flex-direction:column;}
  .tl-time{
    font-family:'Pretendard',monospace;
    font-variant-numeric:tabular-nums;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    padding:9px 0 4px;
  }
  .tl-item:last-child .tl-row{padding-bottom:2px;}
  .tl-row{
    display:flex;
    align-items:stretch;
    gap:0;
  }
  .tl-line{
    width:20px;
    flex:0 0 auto;
    display:flex;
    justify-content:center;
  }
  .tl-line::before{
    content:"";
    width:2px;
    background:var(--line);
  }
  .tl-check{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    padding:0 4px 0 2px;
  }
  .tl-check label{
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px;height:34px;
    cursor:pointer;
  }
  .tl-check input{
    width:21px;height:21px;
    accent-color:var(--accent-study);
    cursor:pointer;
    margin:0;
  }
  .tl-body{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:2px;
    padding:8px 0;
  }
  .tl-label{
    font-size:14.5px;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
  }
  .tl-item.done .tl-label span:nth-child(1){
    text-decoration:line-through;
    text-decoration-color:var(--muted);
    color:var(--muted);
  }
  .tl-item.done .tl-detail{opacity:.6;}
  .tl-detail{font-size:12.5px;color:var(--muted);}
  .tag{
    font-size:10.5px;
    padding:1px 6px;
    border-radius:5px;
    font-weight:600;
    white-space:nowrap;
  }

  .tl-item.type-break .tl-label{color:var(--muted);font-weight:400;font-size:13px;}
  .tl-item.type-break .tl-time{color:var(--muted);font-weight:600;font-size:13px;}

  .tag.type-study{background:var(--accent-study-bg);color:var(--accent-study);}
  .tag.type-class{background:var(--accent-class-bg);color:var(--accent-class);}
  .tag.type-move{background:var(--accent-move-bg);color:var(--accent-move);}
  .tag.type-meal{background:var(--accent-meal-bg);color:var(--accent-meal);}
  .tag.type-event{background:var(--accent-event-bg);color:var(--accent-event);}
  .tag.type-personal{background:var(--accent-personal-bg);color:var(--accent-personal);}
  .tl-item.type-study .tl-line::before{background:var(--accent-study);opacity:.35;}
  .tl-item.type-class .tl-line::before{background:var(--accent-class);opacity:.35;}
  .tl-item.type-move .tl-line::before{background:var(--accent-move);opacity:.35;}
  .tl-item.type-meal .tl-line::before{background:var(--accent-meal);opacity:.35;}
  .tl-item.type-event .tl-line::before{background:var(--accent-event);opacity:.35;}
  .tl-item.type-personal .tl-line::before{background:var(--accent-personal);opacity:.35;}

  footer.note{
    font-size:12.5px;
    color:var(--muted);
    line-height:1.7;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
</style>

  window.__flushSave = function(){

    window.__pendingSave = false;

    window.__docRef.set({ checked: window.__checked })

      .then(function(){
        window.__saving = false;
        if(window.__pendingSave){
          window.__saveTimer = setTimeout(window.__flushSave, 400);
        } else {
          window.__dirty = false;

      });

    var dowNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

    if(label) label.textContent = (now.getMonth()+1) + "." + now.getDate() + " " + dowNames[now.getDay()];
  })();

  var firebaseConfig = {
    apiKey: "AIzaSyBKtgTCfEYmz9gXB3BoaIg6RP3f-UyS44A",
    authDomain: "st-a-1fa85.firebaseapp.com",
    projectId: "st-a-1fa85",
    storageBucket: "st-a-1fa85.firebasestorage.app",
    messagingSenderId: "711161727267",
    appId: "1:711161727267:web:fd9b8229183cc444906496"
  };
  // ============================================================

  try{
    if(firebaseConfig.apiKey === "YOUR_API_KEY"){
      setStatus("firebaseConfig를 아직 채우지 않아서 저장이 꺼져 있어요 (체크는 됨, 새로고침하면 사라짐)");
    } else {
      firebase.initializeApp(firebaseConfig);
      var db = firebase.firestore();
      window.__docRef = db.collection("progress").doc("checklist");
      setStatus("연결하는 중…");
      window.__docRef.onSnapshot(function(snap){
        if(window.__dirty) return;
        var data = snap.exists ? (snap.data() || {}) : {};
        window.__checked = data.checked || {};
        Object.keys(window.__checked).forEach(window.__renderItem);
        Object.keys(window.__dayIds).forEach(function(date){
          window.__renderProgress(date, window.__dayIds[date]);
        });
        setStatus("기기 간 동기화 연결됨", "ok");
      }, function(e){
        setStatus("연결 실패: " + e.message, "err");
      });
    }
  }catch(e){
    setStatus("Firebase 설정 오류: " + e.message, "err");
  }
})();
